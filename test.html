<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass highlight</title>

    <style>

        body{
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;

            background: grey;
           /* background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8Z2xhc3MlMjBoZWFybHxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=800&q=60') no-repeat center center fixed; */
            background-size: cover;
        }

        .glass-card {
            position: relative;
            overflow: hidden;

            width: 320px;
            padding: 2rem;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.45);

            border-radius: 20px;

            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.15);
        }

        /* Highlight */
        /* .glass-card::before {
            content: "";

            position: absolute;
            top: -40%;
            left: -20%;

            width: 60%;
            height: 200%;

            background: rgba(255, 255, 255, 0.12);

            transform: rotate(30deg);

            filter: blur(20px);

            pointer-events: none;
        }*/

        .glass-card::before {
            content: "";

            position: absolute;
            top: 0;
            left: -150%;

            width: 50%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );

            transform: skewX(-25deg);

            animation: shine 4s infinite;

            pointer-events: none;
            
        }

        @keyframes shine {
            100% {
                left: 150%;
            }
        }
    </style>
</head>
<body>
    <div class="glass-card">
    <h2>Glass Card</h2>
    <p>This card has a highlight effect.</p>
</div>
</body>
</html>
